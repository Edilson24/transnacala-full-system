name: Publish Android release

on:
  push:
    tags:
      - "mobile-v*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate release tag and version
        id: version
        run: |
          version="${GITHUB_REF_NAME#mobile-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use mobile-vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_OUTPUT"

      - name: Prepare release signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ]; then
            echo "Configure ANDROID_SIGNING_KEYSTORE_BASE64 in repository Actions secrets." >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/transnacala-release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/transnacala-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] \
            || [ -z "$ANDROID_KEY_ALIAS" ] \
            || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Configure all Android signing secrets before publishing a release." >&2
            exit 1
          fi
          cd transnacala-mobile-android
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/transnacala-mobile.apk"

      - name: Verify APK signature
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner \
            | sort -V | tail -n 1)"
          if [ -z "$apksigner" ]; then
            echo "Android build tools did not provide apksigner." >&2
            exit 1
          fi
          "$apksigner" verify --verbose "$RUNNER_TEMP/transnacala-mobile.apk"

      - name: Publish APK to the tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/transnacala-mobile.apk" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/transnacala-mobile.apk#TransNacala Android APK" \
              --title "TransNacala Android ${GITHUB_REF_NAME#mobile-v}" \
              --generate-notes
          fi

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/transnacala-release.jks"
